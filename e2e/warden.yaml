version: 1
server:
  admin_host: localhost
  bind: 127.0.0.1
  http_port: 8099
  https_port: 8443
  log_level: info
  health_interval_seconds: 3600
database:
  path: warden.db
webauthn:
  rp_id: localhost
  rp_name: Warden E2E
routes:
  - host: app.localhost
    upstream: http://127.0.0.1:8098
    name: Demo App
    auth: true
