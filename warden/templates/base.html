<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0a">
  <title>{{ page_title }} · Warden</title>
  <link rel="icon" href="{{ static_prefix }}/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ static_prefix }}/warden.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  {% block head_extra %}{% endblock %}
</head>
<body data-page="{{ page }}">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <aside class="sidebar" aria-label="Sidebar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2.7 26.8 6.6v8.2c0 6.9-4.4 12.1-10.8 14.5C9.6 26.9 5.2 21.7 5.2 14.8V6.6L16 2.7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="16" cy="13.1" r="2.7" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 15.8v5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Warden</span>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <a href="/" {% if page == 'dashboard' %}class="nav-link active" aria-current="page"{% else %}class="nav-link"{% endif %} data-nav title="Services">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Services</span>
        </a>
        <a href="/users" {% if page == 'users' %}class="nav-link active" aria-current="page"{% else %}class="nav-link"{% endif %} data-nav title="Users">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Users</span>
        </a>
        <a href="/passkeys" {% if page == 'passkeys' %}class="nav-link active" aria-current="page"{% else %}class="nav-link"{% endif %} data-nav title="Access">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          <span>Access</span>
        </a>
        <a href="/activity" {% if page == 'activity' %}class="nav-link active" aria-current="page"{% else %}class="nav-link"{% endif %} data-nav title="Activity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>Activity</span>
        </a>
        <a href="/tls" {% if page == 'tls' %}class="nav-link active" aria-current="page"{% else %}class="nav-link"{% endif %} data-nav title="TLS">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>TLS</span>
        </a>
        <a href="/config" {% if page == 'config' %}class="nav-link active" aria-current="page"{% else %}class="nav-link"{% endif %} data-nav title="Config">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1-2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Config</span>
        </a>
        <a href="/mesh" {% if page == 'mesh' %}class="nav-link active" aria-current="page"{% else %}class="nav-link"{% endif %} data-nav title="Mesh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span>Mesh</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <a href="/backup_codes" {% if page == 'backup_codes' %}class="nav-link active" aria-current="page"{% else %}class="nav-link"{% endif %} data-nav title="Backup codes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Backup</span>
        </a>
      </div>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-left">
          <h1 class="header-title">{{ page_title }}</h1>
        </div>
        <div class="header-actions">
          <span class="host-pill">{{ host }}</span>
          <button class="btn btn-ghost" id="logout-button" type="button" title="Sign out">
            <span>{{ user.display_name }}</span>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <div class="content" id="main" data-view="{{ page }}">
        {% block content %}{% endblock %}
      </div>

      <footer class="sidebar-foot footer-meta">
        <span>warden <span class="mono">v{{ app_version }}</span></span>
      </footer>
    </div>
  </div>

  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="{{ static_prefix }}/warden.js" defer></script>
  <script src="{{ static_prefix }}/admin.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
