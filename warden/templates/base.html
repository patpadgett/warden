<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b100d">
  <title>{{ page_title }} · Warden</title>
  <link rel="icon" href="{{ static_prefix }}/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ static_prefix }}/warden.css">
  {% block head_extra %}{% endblock %}
</head>
<body class="app-body" data-page="{{ page }}" data-host="{{ host }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-head">
    <div class="shell head-inner">
      <a class="brand" href="/" aria-label="Warden dashboard">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2.7 26.8 6.6v8.2c0 6.9-4.4 12.1-10.8 14.5C9.6 26.9 5.2 21.7 5.2 14.8V6.6L16 2.7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="16" cy="13.1" r="2.7" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 15.8v5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="brand-word">warden</span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="/" {% if page == 'dashboard' %}class="active" aria-current="page"{% endif %}>Services</a>
        <a href="/users" {% if page == 'users' %}class="active" aria-current="page"{% endif %}>Users</a>
        <a href="/passkeys" {% if page == 'passkeys' %}class="active" aria-current="page"{% endif %}>Access</a>
        <a href="/activity" {% if page == 'activity' %}class="active" aria-current="page"{% endif %}>Activity</a>
        <a href="/tls" {% if page == 'tls' %}class="active" aria-current="page"{% endif %}>TLS</a>
        <a href="/config" {% if page == 'config' %}class="active" aria-current="page"{% endif %}>Config</a>
        <a href="/mesh" {% if page == 'mesh' %}class="active" aria-current="page"{% endif %}>Mesh</a>
        <a href="/roles" {% if page == 'roles' %}class="active" aria-current="page"{% endif %}>Roles</a>
      </nav>

      <div class="head-actions">
        <span class="secure-pill" title="Authenticated with a passkey">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 7V5.5a3.4 3.4 0 0 1 6.8 0V7M3.5 7h9v6.2h-9V7Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          Passkey
        </span>
        <button class="user-chip" id="logout-button" type="button" title="Sign out">
          <span class="avatar">{{ user.display_name[:1]|upper }}</span>
          <span class="user-name">{{ user.display_name }}</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5H3.5v9H6M7.5 10.5 10 8 7.5 5.5M10 8H5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="shell main-content" id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-foot">
    <div class="shell foot-inner">
      <span>warden <span class="mono">v{{ app_version }}</span></span>
      <span class="foot-sep">·</span>
      <span>{{ host }}</span>
      <span class="foot-grow"></span>
      <span class="foot-note">a quiet door for a loud homelab</span>
    </div>
  </footer>

  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  {% block modals %}{% endblock %}
  <script src="{{ static_prefix }}/warden.js" defer></script>
  <script src="{{ static_prefix }}/admin.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
