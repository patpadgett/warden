apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "warden.fullname" . }}-config
data:
  warden.yaml: |
    server:
      admin_host: {{ .Values.config.adminHost }}
      tls:
        enabled: {{ .Values.config.tlsEnabled }}
    mesh:
      enabled: {{ .Values.config.meshEnabled }}
      interface: {{ .Values.config.meshInterface }}
    database:
      path: /var/lib/warden/warden.db
      type: {{ .Values.database.type }}
      url: {{ .Values.database.url | quote }}
