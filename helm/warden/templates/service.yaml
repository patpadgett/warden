apiVersion: v1
kind: Service
metadata:
  name: {{ include "warden.fullname" . }}
  labels:
    app: warden
spec:
  selector:
    app: warden
  ports:
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: 8080
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: 8443
    - name: mesh-udp
      port: {{ .Values.service.meshPort }}
      targetPort: 51820
      protocol: UDP
