apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warden.fullname" . }}
  labels:
    app: warden
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: warden
  template:
    metadata:
      labels:
        app: warden
    spec:
      containers:
      - name: warden
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8080
        - containerPort: 8443
        - containerPort: 51820
          protocol: UDP
        env:
        - name: WARDEN_CONFIG
          value: /etc/warden/warden.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/warden
        - name: data
          mountPath: /var/lib/warden
      volumes:
      - name: config
        configMap:
          name: {{ include "warden.fullname" . }}-config
      - name: data
        emptyDir: {}
