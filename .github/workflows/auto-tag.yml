name: Auto-Tag on Successful Tests

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest -q

  tag:
    needs: test
    if: success()
    runs-on: ubuntu-latest
    env:
      PAT: ${{ secrets.PAT }}
    steps:
      - name: Checkout code (with token)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          fetch-tags: true

      - name: Debug git auth (list tags)
        run: |
          echo "Remote URL: $(git config --get remote.origin.url)"
          echo "Listing remote tags:"
          git ls-remote --tags origin

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify PAT and set remote
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "PAT secret is empty!" >&2
            exit 1
          else
            echo "PAT secret length: ${#PAT}"
          fi
          # Ensure remote URL includes PAT for push
          git remote set-url origin https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git
          echo "Remote URL set to $(git config --get remote.origin.url)"

      - name: Determine next tag
        id: version
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            ver=${latest#v}
            IFS='.' read -r major minor patch <<< "$ver"
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
          fi
          echo "latest tag: $latest"
          echo "next tag: $next"
          echo "next=$next" >> $GITHUB_OUTPUT

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.version.outputs.next }}
        run: |
          # Force-create the tag (overwrites if it already exists)
          git tag -f "$NEW_TAG"
          echo "Attempting dry-run push..."
          git push origin "$NEW_TAG" --dry-run
          echo "Now pushing tag..."
          git push origin "$NEW_TAG" --force

